<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINETIC SPEC // 机械动力学仿真沙盒</title>
  <!-- 样式外链 -->
  <link rel="stylesheet" href="./style.css">
  <!-- 本地 Matter.js -->
  <script src="./matter.min.js"></script>
</head>
<body>
  <header>
    <div class="header-left">
      <span class="badge"></span>
      <strong id="headerTitle">KINETIC SPEC</strong>&nbsp;//&nbsp;<span id="headerSub">机械动力学仿真沙盒</span>
    </div>
    <div class="header-right">
      <div id="sysStatus">状态: 动力源运行中 / 支持鼠标拖拽</div>
      <div class="lang-switch">
        <button id="langZh" class="lang-btn active">中文</button>
        <button id="langEn" class="lang-btn">EN</button>
      </div>
    </div>
  </header>

  <div id="workspace">
    <div id="sidebar">
      <!-- 00 预设机构选择 -->
      <div class="panel-section">
        <div class="panel-title" id="sec0Title">00 / 经典机构预设 (教材第七章)</div>
        <div class="preset-grid">
          <button id="btnPresetCrank" class="btn-preset active">曲柄滑块</button>
          <button id="btnPresetFourBar" class="btn-preset">铰链四连杆</button>
        </div>
      </div>

      <!-- 01 驱动单元 -->
      <div class="panel-section">
        <div class="panel-title" id="sec1Title">01 / 驱动单元</div>
        <button id="motorBtn" class="btn-toggle active">电机状态: 已接入驱动</button>
      </div>

      <!-- 02 运动学调节 -->
      <div class="panel-section">
        <div class="panel-title" id="sec2Title">02 / 运动学调节</div>
        <div class="control-row">
          <span id="rpmLabel">主动轮转速</span>
          <span id="rpmVal">30 RPM</span>
        </div>
        <input type="range" id="rpmSlider" min="0" max="90" value="30">

        <div class="control-row">
          <span id="frictionLabel">系统阻尼 / 摩擦</span>
          <span id="frictionVal">0.020</span>
        </div>
        <input type="range" id="frictionSlider" min="0" max="0.1" step="0.005" value="0.02">
      </div>

      <!-- 03 实时遥测 -->
      <div class="panel-section">
        <div class="panel-title" id="sec3Title">03 / 实时遥测数据</div>
        <div class="telemetry-grid">
          <div class="telemetry-item">
            <span id="angVelLabel">主动角速度</span>
            <strong id="angVel">3.14 rad/s</strong>
          </div>
          <div class="telemetry-item">
            <span id="dispLabel">滑块位移</span>
            <strong id="dispVal">0.0 px</strong>
          </div>
        </div>
      </div>
    </div>

    <!-- 物理仿真视口 -->
    <div id="viewport"></div>
  </div>

  <footer>
    <div id="footerType">机构形式: 平面曲柄滑块机构</div>
    <div id="footerCore">解算核心: 本地部署 MATTER.JS // 模块化驱动架构</div>
  </footer>

  <!-- 按依赖层级引入各机构与应用主调度脚本 -->
  <script src="./js/mechanisms/crankSlider.js"></script>
  <script src="./js/mechanisms/fourBar.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
